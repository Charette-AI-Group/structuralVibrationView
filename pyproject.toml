[project]
name = "structural-vibration-view"
version = "0.1.0"
description = "Educational 3D animation of structural vibration: see how a beam, plate or spring-mass system deflects while it vibrates (PySide6 + PyVista)"
requires-python = ">=3.14"
dependencies = [
    "PySide6>=6.6,<7",
    "numpy>=1.26",
    "pyvista>=0.44",
    "pyvistaqt>=0.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-qt>=4.4,<5",
    "ruff>=0.4,<1",
]
build = [
    "pyinstaller>=6.10,<7",
    # PyInstaller renders the macOS .icns from the 1024 px PNG with pillow.
    "pillow>=10",
]

[project.scripts]
structural-vibration-view = "structuralVibrationView.main:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
qt_api = "pyside6"
python_files = ["test*.py"]
python_functions = ["test*"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/structuralVibrationView"]
